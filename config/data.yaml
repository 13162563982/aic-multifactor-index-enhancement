# Public data-source configuration. Owner: marketdata teammate.
# All sources are free, token-less HTTP endpoints. The snapshot builder retries
# transient failures and records provenance in manifest.json.

sources:
  eastmoney:
    # Historical K-line data lives on push2his; the push2/push2-numbered hosts
    # answer HTTP 200 with an empty klines list for historical ranges but are
    # kept for rotation because they are useful for the list endpoint.
    hosts:
      - push2his.eastmoney.com
      - push2.eastmoney.com
      - 82.push2.eastmoney.com
      - 1.push2.eastmoney.com
    kline_url: "https://{host}/api/qt/stock/kline/get"
    list_url: "https://{host}/api/qt/clist/get"
    datacenter_url: "https://datacenter-web.eastmoney.com/api/data/v1/get"
    index_secid: "1.000300"
    csi300_board: "b:BK0500"
    page_size: 100
    timeout_s: 20
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AICWF academic research"
    # The public hosts advertise IPv6 addresses whose paths are broken from this
    # environment (frequent resets); the IPv4 path is fast and reliable. Pin the
    # resolution to IPv4 inside data-fetching processes only.
    ipv4_only: true
    retry:
      attempts: 10
      backoff_seconds: [0.5, 1.0, 2.0, 3.0, 5.0, 8.0, 12.0, 18.0, 25.0, 30.0]
      jitter_fraction: 0.3
    # Historical bars: ~50% of fresh connections are reset by the public hosts,
    # so the K-line client gets more attempts and a longer backoff ladder.
    kline_retry:
      attempts: 12
      backoff_seconds: [0.4, 0.8, 1.5, 2.5, 4.0, 6.0, 8.0, 10.0, 12.0, 15.0, 18.0, 20.0]
      jitter_fraction: 0.3
    fundamentals_retry:
      attempts: 8
      backoff_seconds: [0.5, 1.0, 2.0, 3.0, 5.0, 8.0, 12.0]
      jitter_fraction: 0.3
    kline:
      # Public constant used by Eastmoney's own web widget (not a secret/API key).
      ut: "fa5fd1943c7b386f172d6893dbfba10b"
      # Only push2his serves historical K-lines. It appears multiple times so the
      # round-robin retry rotation mostly lands on it; the other hosts are kept as
      # a last-resort fallback (they usually answer HTTP 200 with empty klines).
      hosts:
        - push2his.eastmoney.com
        - push2his.eastmoney.com
        - push2.eastmoney.com
      fields1: "f1,f2,f3,f4,f5,f6"
      fields2: "f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61"
    list_fields: "f12,f13,f14,f2,f3,f8,f9,f20,f21,f23,f26,f100"
    # Public hosts rate-limit bursts (all endpoints start resetting connections
    # for a while). 0.5 s between requests keeps a 300-name build under ~7 min
    # and is much gentler than the default 0.15 s.
    polite_delay_seconds: 0.5

  fundamentals:
    report: RPT_F10_FINANCE_MAINFINADATA
    page_size: 60
    fields:
      - SECUCODE
      - REPORT_DATE
      - NOTICE_DATE
      - EPSJB
      - BPS
      - TOTALOPERATEREVE
      - PARENTNETPROFIT
      - TOTALOPERATEREVETZ
      - PARENTNETPROFITTZ
      - MLR
      - MGJYXJJE

snapshot:
  root: data/snapshots
  schema_version: "1.1.0"
  max_price_lookback_days: 4200
  min_universe_size: 250
  keep_raw_downloads: false

quality:
  max_missing_price_ratio: 0.10
  max_stale_trading_days: 5
  min_fundamental_coverage: 0.85
  duplicate_rows_allowed: false
  require_positive_prices: true
