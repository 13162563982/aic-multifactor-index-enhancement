run:
  max_wall_seconds: 900
  max_llm_calls: 40
  max_tokens_total: 200000
  max_cost_usd: 0.0
  max_retries_per_step: 3
  retry_backoff_seconds:
  - 1.0
  - 2.0
  - 4.0
  retry_jitter_fraction: 0.2
  max_revision_rounds: 2
  stage_default_timeout_s: 600
retry:
  transient_categories:
  - RetryableError
  - TimeoutError
  - ConnectionError
  - StageTimeout
  - TransientError
  - TransientFailure
  escalate_categories:
  - ValidationError
  - DataQualityError
  - EscalationRequired
  non_retryable_categories:
  - NonRetryableError
  - ConfigError
llm:
  price_per_1k_input_usd: 0.0
  price_per_1k_output_usd: 0.0
